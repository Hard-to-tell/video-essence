<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精华 · 视频提炼</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Cpath d='M10 21l6-11 6 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M10 21l6-11 6 11" /></svg>
        </div>
        <div>
          <div class="brand-name">精华</div>
          <div class="brand-sub">视频只留干货</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button data-view="home" class="active">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>开始</span>
        </button>
        <button data-view="queue">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>
          <span>进度</span><em class="nav-badge" id="nav-running" hidden></em>
        </button>
        <button data-view="library">
          <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>
          <span>总结库</span>
        </button>
        <button data-view="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="sys" id="sys"></div>
    </aside>

    <main class="main">
      <div class="mock-banner" id="mock-banner" hidden>
        演示模式：后端接口还没接上，下面是模拟数据，用来看界面效果。
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" hidden></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
